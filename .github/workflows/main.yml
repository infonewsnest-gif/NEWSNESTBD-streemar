name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Root Gradle Files
      run: |
        # Ensure root settings.gradle.kts exists so gradle wrapper works
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle.kts
        fi
        if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
          echo "plugins { id('com.android.application') version '8.2.0' apply false }" > build.gradle.kts
        fi

    - name: Create Gradle wrapper fallback
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
